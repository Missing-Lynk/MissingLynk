# Vet and unit-test the host flasher's Go packages (flasher/).

name: go

on:
  push:
    branches: [master]
    paths:
      - "flasher/**"
      - "scripts/gen-flasher-devconf.py"
      # rootfs is a submodule: a board.conf edit reaches this repo as a pointer bump on "rootfs".
      - "rootfs"
      - "devices/**/device.mk"
      - "Makefile"
      - ".github/workflows/go.yml"

  pull_request:
    paths:
      - "flasher/**"
      - "scripts/gen-flasher-devconf.py"
      # rootfs is a submodule: a board.conf edit reaches this repo as a pointer bump on "rootfs".
      - "rootfs"
      - "devices/**/device.mk"
      - "Makefile"
      - ".github/workflows/go.yml"

  workflow_dispatch:

concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      # gen-flasher-devconf.py needs rootfs/devices/<name>/board.conf. .gitmodules gives SSH URLs a
      # runner has no key for; the rewrite fetches the (public) submodule over HTTPS instead.
      - name: Check out the rootfs submodule
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --depth 1 rootfs

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: flasher/go.sum

      # setup-uv publishes no floating major tag past v7, so this pins the exact release.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Vet and test
        run: make check-go
