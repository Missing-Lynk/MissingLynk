# Lint and unit-test the host-side Python: the missinglynk CLI, its tests, and the glue scripts.
#
# Deliberately does NOT check out the submodules. Nothing here needs them (the tests fake every
# device call at the connection seam), they are reached over SSH URLs a CI runner has no key for,
# and skipping them keeps the job to a few seconds.
#
# One interpreter, no matrix: the project pins Python in .python-version, and requires-python
# declares the same floor, so there is exactly one version to test and CI matches a local
# `make check-python` exactly. uv reads .python-version itself, which is why no version is named
# here: bumping the pin in that one file moves dev and CI together, and this file needs no edit.
#
# The path filters are duplicated between push and pull_request because the workflow parser does
# not support YAML anchors.

name: python

on:
  push:
    branches: [master]
    paths:
      - "missinglynk/**"
      - "tests/**"
      - "glue/**/*.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "missinglynk/**"
      - "tests/**"
      - "glue/**/*.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/python.yml"
  workflow_dispatch:

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # Stated rather than left to the default: the Python trees do not need the submodules,
          # and the job must not start depending on them by accident.
          submodules: false

      # setup-uv publishes no floating major tag past v7, so this pins the exact release.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Lint
        run: uv run --group dev ruff check .

      - name: Test
        run: uv run --group dev pytest
