# Build the host flasher for Windows (x86-64) and keep it as a workflow artifact.
# Cross-built on a Linux runner: flasher/Dockerfile.windows carries the mingw-w64 toolchain.

name: flasher-windows

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to build. Blank uses the branch selected above; refs/pull/<n>/head builds a PR from a fork."
        required: false
        type: string

  workflow_call:
    inputs:
      ref:
        description: "Ref to build. Blank uses the ref the caller is running on."
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # Blank = the ref the run started from: the dispatch form's branch, or release.yml's tag.
          ref: ${{ inputs.ref }}
          submodules: false

      # make flasher-windows needs rootfs/devices/<name>/board.conf. .gitmodules gives SSH URLs a
      # runner has no key for; the rewrite fetches the (public) submodule over HTTPS instead.
      - name: Check out the rootfs submodule
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --depth 1 rootfs

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # native/build.sh compiles in an arm64 gcc:7 container.
      - name: Set up arm64 emulation
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      # Only mlflash: the other device tools are not embedded in the flasher.
      - name: Build mlflash (aarch64)
        run: make native-mlflash

      - name: Build ml-flasher.exe
        run: make flasher-windows

      # Named after the tag when there is one, after the commit otherwise, so a downloaded binary
      # says which build it is. release.yml attaches these names to the release as they are.
      - name: Stage the binary
        run: |
          case "$GITHUB_REF_TYPE" in
              tag) label="$GITHUB_REF_NAME" ;;
              *)   label="$(git rev-parse --short HEAD)" ;;
          esac
          mkdir -p dist
          cp flasher/build/ml-flasher.exe "dist/ml-flasher-${label}-windows-amd64.exe"

      - name: Upload ml-flasher.exe
        uses: actions/upload-artifact@v7
        with:
          name: ml-flasher-windows
          path: dist/ml-flasher-*-windows-amd64.exe
          if-no-files-found: error
