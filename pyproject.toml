[project]
name = "missinglynk"
version = "0.1.0"
description = "Tools for the BetaFPV VR04 / Artosyn ArtLynk FPV goggle: framebuffer capture and RTSP stream enable/disable over its USB-ethernet link."
readme = "README.md"
license = { file = "LICENSE" }
# Pinned to one interpreter, matched by .python-version and the single CI job. uv fetches it
# automatically; a plain `python3 -m venv` needs 3.14 installed (see docs/guides/python-tooling.md).
requires-python = ">=3.14"
dependencies = [
    # SSH to the goggle's legacy-crypto Dropbear (cross-platform, no sshpass).
    # Pinned <4: paramiko 4.x/5.x REMOVED diffie-hellman-group1/14-sha1 and ssh-rsa,
    # which this Dropbear requires. 3.5.x still implements them.
    "paramiko>=3.5,<4",
    "numpy>=1.24",     # framebuffer decode
    "pillow>=10.0",    # PNG output
    # Kernel-container packing (glue/flash/mkkernel.py): U-Boot's LZ4 decompressor needs
    # INDEPENDENT frame blocks, which lz4.frame provides (block_linked=False).
    "lz4>=4",
    # Serial UART bridge for the boot ladder (glue/boot/* drop-to-U-Boot / RAM-boot, and
    # glue/recovery/* BootROM): console.py, uboot_boot.py, wait-for-serial.py all `import serial`.
    "pyserial>=3.5",
]

[project.scripts]
# one entry point, two subcommands (see `missinglynk --help`)
missinglynk = "missinglynk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["missinglynk"]

# Host-side checks only (`make check-python`), never shipped to a device.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
# Follows requires-python: one interpreter, so the UP rules may target it directly.
target-version = "py314"
line-length = 100
include = ["missinglynk/**/*.py", "tests/**/*.py", "glue/**/*.py"]
# glue/dev/ is gitignored per-machine scratch, not part of the tree.
extend-exclude = ["glue/dev"]

[tool.ruff.lint]
# E/F/W/I: errors, pyflakes, warnings, import order. UP/B/C4/SIM: pyupgrade, bugbear,
# comprehensions, simplify - all clean on this tree, so they stay on to keep it that way.
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
# SIM108 (collapse if/else into a ternary) is declined: both sites it flags are branch logic that
# reads better spelled out, one of them the A/B active-bit choice in gpt_setactive.py.
ignore = ["SIM108"]

[tool.ruff.lint.per-file-ignores]
# glue/ is held to every substantive rule, but not to the line limit: its 40 over-long lines are
# comments, docstrings, argparse help, and exact serial byte literals in the recovery path.
# Reflowing those carries more risk than the cosmetics are worth.
"glue/**/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# No test may touch a device or the network; anything that would is mocked at the seam.
addopts = "-q"
